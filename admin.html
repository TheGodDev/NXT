<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NXT Portal | Administrator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="dashboard" data-role="admin">
    <header class="topbar"><div class="brand">LCPS GO</div><button class="logout" type="button">Sign out</button></header>
    <main class="dashboard-main">
      <p class="badge">ADMINISTRATOR</p>
      <h1>Administrator dashboard</h1>
      <p class="dashboard-lead">You are signed in with administrator access.</p>
      <section class="grid">
        <article class="panel"><h2>Account management</h2><p>Review and manage demo portal accounts.</p></article>
        <article class="panel"><h2>System activity</h2><p>View recent activity and system notifications.</p></article>
        <article class="panel"><h2>Settings</h2><p>Configure the portal’s demo settings.</p></article>
      </section>
    </main>
    <div class="lcps-go-footer" aria-label="LCPS GO symbol">
      <span class="lcps-go-badge">LCPS</span>
      <span class="lcps-go-word">GO</span>
    </div>
    <script src="dashboard.js"></script>
  </body>
</html>
