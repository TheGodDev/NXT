<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NXT Portal | User</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="dashboard" data-role="user">
    <header class="topbar"><div class="brand">LCPS GO</div><button class="logout" type="button">Sign out</button></header>
    <main class="dashboard-main">
      <p class="badge">USER</p>
      <h1>User dashboard</h1>
      <p class="dashboard-lead">You are signed in with standard user access.</p>
      <section class="grid">
        <article class="panel"><h2>My profile</h2><p>View your account details and preferences.</p></article>
        <article class="panel"><h2>My resources</h2><p>Find the resources available to your account.</p></article>
        <article class="panel"><h2>Support</h2><p>Get help with the NXT demo portal.</p></article>
      </section>
    </main>
    <div class="lcps-go-footer" aria-label="LCPS GO symbol">
      <span class="lcps-go-badge">LCPS</span>
      <span class="lcps-go-word">GO</span>
    </div>
    <script src="dashboard.js"></script>
  </body>
</html>
