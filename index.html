<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NXT | Sign In</title>
    <meta name="description" content="Sign in to the NXT portal." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;0,6..12,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="nxt-login-page">

    <!-- Animated background canvas -->
    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <div class="nxt-login-shell">

      <!-- Logo / wordmark -->
      <div class="nxt-wordmark" aria-label="NXT">
        <span class="nxt-wordmark-n">N</span><span class="nxt-wordmark-x">X</span><span class="nxt-wordmark-t">T</span>
      </div>
      <p class="nxt-tagline">Your portal. Your access.</p>

      <!-- Card -->
      <main class="nxt-card" aria-labelledby="login-heading">
        <h1 id="login-heading">Sign In</h1>

        <form id="login-form" novalidate>
          <div class="nxt-field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
              spellcheck="false"
            />
          </div>

          <div class="nxt-field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
                required
              />
              <button
                class="show-password"
                id="show-password"
                type="button"
                aria-label="Show password"
              >Show</button>
            </div>
          </div>

          <p
            id="error-message"
            class="nxt-error"
            role="alert"
            aria-live="polite"
          ></p>

          <button class="nxt-sign-in" id="sign-in-btn" type="submit">
            <span class="btn-label">Sign In</span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>

          <!-- confirm password shown only in create-account mode -->
          <div class="nxt-field" id="confirm-field" style="display:none;margin-top:18px;">
            <label for="confirm-password">Confirm Password</label>
            <div class="password-wrap">
              <input
                id="confirm-password"
                name="confirm-password"
                type="password"
                autocomplete="new-password"
                placeholder="••••••••"
              />
            </div>
          </div>
        </form>

        <p class="nxt-mode-toggle">
          <span id="mode-hint">New here?</span>
          <button type="button" id="mode-switch">Create an account</button>
        </p>
      </main>

    </div>

    <!-- Panic button — opens google.com as a cover -->
    <button
      class="nxt-panic"
      id="panic-btn"
      type="button"
      aria-label="Emergency exit"
    >PANIC</button>

    <!-- Firebase via CDN (ESM) -->
    <script type="module" src="script.js"></script>
  </body>
</html>
